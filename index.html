<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0288d1">
  <meta name="description" content="A collection of games by John Allen.">
  <title>Games | John Allen</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17324d; background: #eaf7ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #c8efff, transparent 38%), #eaf7ff; }
    main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    header { margin-bottom: 32px; }
    h1 { margin: 0 0 8px; font-size: clamp(2.2rem, 6vw, 3.8rem); letter-spacing: -0.04em; }
    header p { margin: 0; color: #48657d; font-size: 1.1rem; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 20px; }
    .game-card { display: flex; flex-direction: column; min-height: 290px; padding: 24px; border: 2px solid #c5e1f1; border-radius: 24px; background: rgba(255,255,255,.92); box-shadow: 0 10px 28px rgba(24, 78, 111, .09); }
    .game-icon { display: grid; place-items: center; width: 76px; height: 76px; margin-bottom: 18px; border-radius: 22px; background: #e1f7e8; font-size: 2.7rem; }
    .game-card h2 { margin: 0 0 8px; font-size: 1.45rem; }
    .game-card p { margin: 0 0 22px; color: #526b80; line-height: 1.55; }
    .game-card a { display: inline-flex; align-items: center; justify-content: center; margin-top: auto; min-height: 48px; padding: 10px 18px; border-radius: 14px; color: white; background: #0277bd; font-weight: 750; text-decoration: none; }
    .game-card a:hover, .game-card a:focus-visible { background: #015c91; outline: 3px solid #80d8ff; outline-offset: 3px; }
    footer { margin-top: 40px; color: #597286; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Games</h1>
      <p>Pick a game and have some fun!</p>
    </header>
    <section class="games" aria-label="Available games">
      <article class="game-card">
        <div class="game-icon" aria-hidden="true">🐶🍦</div>
        <h2>Pup Ice Cream Party!</h2>
        <p>Serve the rescue pups their favorite ice cream—and help the recycling pup clean up tasty trash.</p>
        <a href="./games/pup-ice-cream-party/">Play Pup Ice Cream Party</a>
      </article>
    </section>
    <footer>More games coming soon.</footer>
  </main>
</body>
</html>
