<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff7eb3" />
  <title>Princess Dress-Up & Tea Party</title>
  <style>
    :root {
      --pink-1: #fff0f7;
      --pink-2: #ffd6ea;
      --pink-3: #ff85bc;
      --pink-4: #e83e8c;
      --purple-1: #f3e8ff;
      --purple-2: #9b5de5;
      --gold-1: #fff3b0;
      --gold-2: #ffb703;
      --teal-1: #d8f8f3;
      --teal-2: #00bbf9;
      --text-dark: #4a1c40;
      --shadow-soft: 0 8px 20px rgba(120, 35, 90, 0.16);
      --shadow-btn: 0 5px 0 rgba(130, 30, 85, 0.28), 0 8px 16px rgba(130, 30, 85, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      touch-action: manipulation;
      font-family: "Rounded Mplus 1c", "Nunito", "Quicksand", "Comic Sans MS", system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #ffe5f4 0%, #f5e6ff 52%, #e0f7fa 100%);
      color: var(--text-dark);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 6px) 10px env(safe-area-inset-bottom, 8px) 10px;
      overflow: hidden;
    }

    .bg-sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-star {
      position: absolute;
      font-size: 20px;
      opacity: 0.45;
      animation: floatStar 6s ease-in-out infinite;
    }

    @keyframes floatStar {
      0%, 100% { transform: translateY(0) scale(0.95) rotate(0deg); }
      50% { transform: translateY(-12px) scale(1.12) rotate(12deg); }
    }

    /* Top Navigation Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 2px;
      flex-shrink: 0;
    }

    .nav-btn {
      border: 3px solid #fff;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff 0%, #ffe6f2 100%);
      color: var(--text-dark);
      font-weight: 800;
      font-size: 15px;
      min-height: 50px;
      padding: 6px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 4px 0 rgba(160, 50, 110, 0.22), 0 6px 12px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .nav-btn:active {
      transform: translateY(3px) scale(0.95);
      box-shadow: 0 1px 0 rgba(160, 50, 110, 0.22);
    }

    .mode-pills {
      display: flex;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .mode-pill {
      flex: 1;
      max-width: 148px;
      border: 3px solid #fff;
      border-radius: 999px;
      min-height: 52px;
      padding: 6px 10px;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.8);
      color: #7c3a6b;
      box-shadow: 0 4px 0 rgba(140, 50, 110, 0.18);
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    .mode-pill.active {
      background: linear-gradient(180deg, #ff8ec7 0%, #ff5ca8 100%);
      color: #fff;
      text-shadow: 0 1px 2px rgba(130, 15, 70, 0.45);
      box-shadow: 0 5px 0 #c92a76, 0 8px 16px rgba(232, 62, 140, 0.32);
      transform: scale(1.03);
    }

    .mode-pill:active {
      transform: scale(0.95);
    }

    .icon-only-btn {
      width: 52px;
      padding: 0;
      font-size: 22px;
      flex-shrink: 0;
    }

    /* Screens */
    .screen {
      position: relative;
      z-index: 5;
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
    }

    .screen.active {
      display: flex;
    }

    /* SCREEN 1: PRINCESS SELECT */
    .select-header {
      text-align: center;
      padding: 4px 0 8px 0;
      flex-shrink: 0;
    }

    .select-title {
      margin: 0;
      font-size: clamp(24px, 6vw, 31px);
      font-weight: 900;
      color: #b5176e;
      text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(255, 105, 180, 0.25);
      letter-spacing: 0.3px;
    }

    .princess-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      padding: 2px 2px 6px 2px;
      min-height: 0;
    }

    .princess-card {
      position: relative;
      border: 4px solid #fff;
      border-radius: 26px;
      padding: 6px 6px 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-btn);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.12s ease;
    }

    .princess-card:active {
      transform: scale(0.94);
    }

    .princess-card-art {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      animation: gentleBob 3.2s ease-in-out infinite;
    }

    .princess-card:nth-child(2) .princess-card-art { animation-delay: 0.4s; }
    .princess-card:nth-child(3) .princess-card-art { animation-delay: 0.8s; }
    .princess-card:nth-child(4) .princess-card-art { animation-delay: 1.2s; }
    .princess-card:nth-child(5) .princess-card-art { animation-delay: 1.6s; }
    .princess-card:nth-child(6) .princess-card-art { animation-delay: 2.0s; }

    .princess-card-art svg {
      height: 100%;
      max-height: 135px;
      width: auto;
      overflow: visible;
    }

    .princess-card-label {
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-dark);
      font-size: 16px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      white-space: nowrap;
    }

    /* SCREEN 2: DRESS UP */
    .dressup-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 4px 0 8px 0;
      border-radius: 30px;
      border: 4px solid #fff;
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 232, 246, 0.72) 55%, rgba(232, 214, 255, 0.82) 100%);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .castle-arch {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .pedestal {
      position: absolute;
      bottom: 10px;
      width: 210px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #fff5fa 0%, #ffc2e2 65%, #f48fb1 100%);
      border: 3px solid #fff;
      box-shadow: 0 8px 18px rgba(200, 60, 130, 0.25);
    }

    .princess-hero-wrap {
      position: relative;
      z-index: 3;
      height: 85%;
      max-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      animation: gentleBob 3s ease-in-out infinite;
    }

    .princess-hero-wrap svg {
      height: 100%;
      width: auto;
      overflow: visible;
      filter: drop-shadow(0 10px 14px rgba(95, 30, 75, 0.18));
    }

    .princess-hero-wrap.twirling {
      animation: heroTwirl 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .princess-hero-wrap.pop-bounce {
      animation: popBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes heroTwirl {
      0% { transform: scale(1) rotateY(0deg) translateY(0); }
      40% { transform: scale(1.12) rotateY(180deg) translateY(-18px); }
      100% { transform: scale(1) rotateY(360deg) translateY(0); }
    }

    @keyframes popBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.11) translateY(-10px); }
      100% { transform: scale(1) translateY(0); }
    }

    /* Big Toddler Action Docks */
    .action-dock {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      padding: 2px 0 2px 0;
    }

    .action-dock.four-cols {
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .big-toy-btn {
      border: 3.5px solid #fff;
      border-radius: 20px;
      min-height: 66px;
      padding: 5px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #fff;
      font-weight: 900;
      font-size: 13.5px;
      text-shadow: 0 1.5px 2px rgba(80, 15, 50, 0.45);
      box-shadow: var(--shadow-btn);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .action-dock.four-cols .big-toy-btn {
      min-height: 76px;
    }

    .big-toy-btn:active {
      transform: translateY(4px) scale(0.93);
      box-shadow: 0 2px 0 rgba(120, 30, 80, 0.25);
    }

    .big-toy-btn .btn-emoji {
      font-size: 29px;
      line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
    }

    .big-toy-btn .btn-text {
      line-height: 1.05;
      text-align: center;
    }

    .btn-pink { background: linear-gradient(180deg, #ff85c0 0%, #f72585 100%); }
    .btn-gold { background: linear-gradient(180deg, #ffd166 0%, #f77f00 100%); }
    .btn-purple { background: linear-gradient(180deg, #c77dff 0%, #7b2cbf 100%); }
    .btn-teal { background: linear-gradient(180deg, #4cc9f0 0%, #0096c7 100%); }
    .btn-mint { background: linear-gradient(180deg, #52b788 0%, #2d6a4f 100%); }
    .btn-rainbow {
      background: linear-gradient(135deg, #ff6b9d 0%, #ffb703 35%, #4cc9f0 70%, #b5179e 100%);
    }

    /* SCREEN 3: TEA PARTY */
    .teaparty-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 4px 0 8px 0;
      border-radius: 30px;
      border: 4px solid #fff;
      background: linear-gradient(180deg, #d8f3ff 0%, #fff0f8 55%, #d8f8e5 100%);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .garden-decor {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* 4-Character Seating Layout */
    .party-row {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 4px 8px 0 8px;
      height: 36%;
    }

    .party-row.bottom-row {
      align-items: flex-start;
      padding: 0 8px 6px 8px;
      height: 36%;
      z-index: 6;
    }

    .seat-slot {
      position: relative;
      width: 48%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .seat-char {
      position: relative;
      height: 86%;
      max-height: 142px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: gentleBob 3.1s ease-in-out infinite;
      transition: transform 0.15s ease;
    }

    .seat-slot:nth-child(2) .seat-char { animation-delay: 0.6s; }

    .seat-char svg {
      height: 100%;
      width: auto;
      overflow: visible;
      filter: drop-shadow(0 5px 8px rgba(80, 25, 65, 0.18));
    }

    .seat-char.happy-react {
      animation: popBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .seat-char.waving-hello {
      animation: waveBodyBob 0.5s ease-in-out infinite alternate;
    }

    .wave-limb {
      animation: handWave 0.32s ease-in-out infinite alternate;
    }

    @keyframes handWave {
      0% { transform: rotate(-16deg); }
      100% { transform: rotate(20deg); }
    }

    @keyframes waveBodyBob {
      0% { transform: translateY(0) rotate(-3deg) scale(1.04); }
      100% { transform: translateY(-6px) rotate(3deg) scale(1.06); }
    }

    .seat-char.sipping-tea {
      animation: sipTilt 1.3s ease-in-out;
    }

    .seat-char.chewing-food {
      animation: chewNibble 1.2s ease-in-out;
    }

    .seat-char.dancing-happy {
      animation: happyDance 0.55s ease-in-out infinite;
    }

    @keyframes sipTilt {
      0% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-6px) rotate(-6deg) scale(1.04); }
      60% { transform: translateY(-8px) rotate(6deg) scale(1.05); }
      100% { transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes chewNibble {
      0% { transform: translateY(0) scale(1); }
      22% { transform: translateY(-6px) scale(1.06); }
      40% { transform: translateY(0px) scale(1.02); }
      58% { transform: translateY(-6px) scale(1.06); }
      76% { transform: translateY(0px) scale(1.02); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes happyDance {
      0%, 100% { transform: translateY(0) rotate(-7deg) scale(1.03); }
      25% { transform: translateY(-13px) rotate(0deg) scale(1.08); }
      50% { transform: translateY(0) rotate(7deg) scale(1.03); }
      75% { transform: translateY(-13px) rotate(0deg) scale(1.08); }
    }

    /* Single Teacup or Single Food Item Animated to Mouth */
    .single-mouth-item {
      position: absolute;
      bottom: 30%;
      left: 50%;
      font-size: 34px;
      z-index: 14;
      pointer-events: none;
      filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.24));
    }

    .single-mouth-item.drink-anim {
      animation: singleDrinkLift 1.3s ease-in-out forwards;
    }

    .single-mouth-item.eat-anim {
      animation: singleFoodBite 1.2s ease-in-out forwards;
    }

    @keyframes singleDrinkLift {
      0% { transform: translate(-20%, 34px) scale(0.75) rotate(0deg); opacity: 0; }
      22% { transform: translate(-35%, 2px) scale(1.15) rotate(-18deg); opacity: 1; }
      72% { transform: translate(-40%, -4px) scale(1.15) rotate(-25deg); opacity: 1; }
      100% { transform: translate(-25%, 16px) scale(0.4) rotate(0deg); opacity: 0; }
    }

    @keyframes singleFoodBite {
      0% { transform: translate(-50%, 36px) scale(0.8); opacity: 0; }
      20% { transform: translate(-50%, 2px) scale(1.2); opacity: 1; }
      42% { transform: translate(-50%, -4px) scale(0.95); opacity: 1; }
      62% { transform: translate(-50%, -2px) scale(0.72); opacity: 1; }
      82% { transform: translate(-50%, -5px) scale(0.45); opacity: 0.9; }
      100% { transform: translate(-50%, -8px) scale(0.1); opacity: 0; }
    }

    /* Larger Toddler-Friendly Guest Swap Buttons */
    .guest-swap-pill {
      position: absolute;
      top: 2px;
      right: 0;
      z-index: 15;
      border: 3px solid #fff;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff5b8 0%, #ffc300 100%);
      color: #4a2000;
      font-size: 15px;
      font-weight: 900;
      padding: 8px 14px;
      min-height: 46px;
      min-width: 90px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 4px 0 rgba(160, 95, 5, 0.35), 0 6px 12px rgba(0,0,0,0.16);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .bottom-row .guest-swap-pill {
      top: auto;
      bottom: 2px;
    }

    .guest-swap-pill:active {
      transform: scale(0.92) translateY(2px);
    }

    .host-badge {
      position: absolute;
      top: 4px;
      left: 2px;
      z-index: 8;
      background: rgba(255, 255, 255, 0.92);
      border: 2.5px solid #ff85bc;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 900;
      color: #b5176e;
      pointer-events: none;
    }

    /* Royal Tea Table in Center */
    .tea-table-wrap {
      position: relative;
      z-index: 5;
      height: 29%;
      min-height: 118px;
      margin: -8px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tea-table {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: radial-gradient(ellipse at 50% 35%, #ffffff 0%, #ffe3f1 68%, #ffadd6 100%);
      border: 4px solid #fff;
      box-shadow: 0 8px 0 #f48fb1, 0 14px 24px rgba(140, 35, 95, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .table-center-item {
      position: relative;
      z-index: 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .table-center-item:active {
      transform: scale(0.9);
    }

    .platter-btn {
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f8edeb 80%, #e8d5d0 100%);
      border: 2.5px solid #ffd166;
      box-shadow: 0 4px 8px rgba(130, 40, 85, 0.16);
      width: 72px;
      height: 64px;
      border-radius: 50%;
    }

    .platter-btn.nibbled {
      animation: platterBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes platterBounce {
      0% { transform: scale(1); }
      45% { transform: scale(1.2) translateY(-6px); }
      100% { transform: scale(1); }
    }

    .teapot-center {
      width: 76px;
      height: 76px;
    }

    .teapot-center.pouring {
      animation: pourTilt 0.9s ease-in-out;
    }

    @keyframes pourTilt {
      0% { transform: translateY(0) rotate(0deg) scale(1); }
      30% { transform: translateY(-18px) rotate(-28deg) scale(1.18); }
      70% { transform: translateY(-18px) rotate(-28deg) scale(1.18); }
      100% { transform: translateY(0) rotate(0deg) scale(1); }
    }

    /* 4 Place Settings on the Table */
    .place-setting {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 8;
      cursor: pointer;
      min-width: 44px;
      min-height: 36px;
      justify-content: center;
    }

    .place-0 { top: 4px; left: 9%; }
    .place-1 { top: 4px; right: 9%; }
    .place-2 { bottom: 4px; left: 9%; }
    .place-3 { bottom: 4px; right: 9%; }

    .teacup-icon, .treat-icon {
      font-size: 29px;
      line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.16));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    }

    .teacup-icon.filled {
      animation: treatPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .teacup-icon.cleared {
      transform: scale(0);
      opacity: 0;
    }

    .treat-icon.pop-in {
      animation: treatPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .treat-icon.consumed {
      transform: scale(0.78);
      opacity: 0.7;
    }

    @keyframes treatPop {
      0% { transform: scale(0); }
      70% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    /* Floating Celebration Particles */
    #fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .fx-particle {
      position: absolute;
      font-size: 26px;
      will-change: transform, opacity;
      animation: particleBurst 1.05s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes particleBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4);
      }
      60% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="bg-sparkles" aria-hidden="true">
      <span class="bg-star" style="top:8%; left:8%;">✨</span>
      <span class="bg-star" style="top:14%; right:10%; animation-delay:1.1s;">💖</span>
      <span class="bg-star" style="top:46%; left:4%; animation-delay:2.2s;">⭐</span>
      <span class="bg-star" style="top:52%; right:6%; animation-delay:0.7s;">🌸</span>

  <script>
    /* ============================================================
       1. ANDROID PWA MANIFEST & TODDLER TOUCH GUARDRAILS
       ============================================================ */
    (function setupInlinePWA() {
      const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">

        <rect width="512" height="512" rx="115" fill="url(#bg)"/>
        <path d="M110,350 L140,180 L215,255 L256,145 L297,255 L372,180 L402,350 Z" fill="#ffd166" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
        <rect x="110" y="345" width="292" height="42" rx="18" fill="#ffb703" stroke="#fff" stroke-width="12"/>
        <circle cx="256" cy="275" r="22" fill="#ff4d94" stroke="#fff" stroke-width="8"/>
        <circle cx="178" cy="295" r="15" fill="#4cc9f0" stroke="#fff" stroke-width="6"/>
        <circle cx="334" cy="295" r="15" fill="#4cc9f0" stroke="#fff" stroke-width="6"/>
      </svg>`;
      const iconUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(iconSvg);
      const manifest = {
        name: "Princess Dress-Up & Tea Party",
        short_name: "Princess Party",
        start_url: ".",
        display: "standalone",
        orientation: "portrait",
        background_color: "#ffe5f4",
        theme_color: "#ff7eb3",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
          { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
        ]
      };
      try {
        const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      } catch (e) {}
    })();

    // Disable pinch zoom, multi-touch, double-tap zoom, and pull-to-refresh
    document.addEventListener("touchstart", (e) => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    document.addEventListener("touchmove", (e) => {
      e.preventDefault();
    }, { passive: false });

    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.addEventListener("gesturechange", (e) => e.preventDefault());
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    /* ============================================================
       2. PRINCESS MUSIC BOX, DRINKING, EATING & GREETING SOUNDS
       ============================================================ */
    let soundEnabled = true;
    let audioCtx = null;
    let bgmTimer = null;
    let bgmStep = 0;

    const WALTZ_NOTES = [
      523.25, 659.25, 783.99, 659.25, 783.99, 1046.50,
      987.77, 783.99, 659.25, 587.33, 659.25, 783.99,
      698.46, 880.00, 1046.50, 880.00, 783.99, 659.25,
      587.33, 493.88, 587.33, 523.25, 0, 0
    ];

    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      startPrincessMusic();
    }

    function startPrincessMusic() {
      if (!soundEnabled || bgmTimer) return;
      bgmTimer = setInterval(() => {
        if (!soundEnabled || !audioCtx || audioCtx.state !== "running") return;
        const freq = WALTZ_NOTES[bgmStep % WALTZ_NOTES.length];
        bgmStep++;
        if (!freq) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.028, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.52);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.55);
      }, 420);
    }

    function stopPrincessMusic() {
      if (bgmTimer) {
        clearInterval(bgmTimer);
        bgmTimer = null;
      }
    }

    // Distinct Drinking Sound Effect ("sip-sip-gulp-ahhh")
    function playDrinkSound() {
      if (!soundEnabled) return;
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const sips = [
        { t: 0.00, f1: 260, f2: 540, dur: 0.22 },
        { t: 0.30, f1: 300, f2: 600, dur: 0.22 },
        { t: 0.60, f1: 340, f2: 680, dur: 0.24 }
      ];

      sips.forEach(({ t, f1, f2, dur }) => {
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(f1, now + t);
        osc.frequency.exponentialRampToValueAtTime(f2, now + t + dur);

        filter.type = "bandpass";
        filter.frequency.setValueAtTime(750, now + t);
        filter.Q.setValueAtTime(3.5, now + t);

        gain.gain.setValueAtTime(0.001, now + t);
        gain.gain.exponentialRampToValueAtTime(0.22, now + t + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + t + dur);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + t);
        osc.stop(now + t + dur + 0.02);
      });

      const bell = audioCtx.createOscillator();
      const bellGain = audioCtx.createGain();
      bell.type = "sine";
      bell.frequency.setValueAtTime(880, now + 0.90);
      bell.frequency.exponentialRampToValueAtTime(1174.66, now + 1.15);
      bellGain.gain.setValueAtTime(0.001, now + 0.90);
      bellGain.gain.exponentialRampToValueAtTime(0.14, now + 0.94);
      bellGain.gain.exponentialRampToValueAtTime(0.001, now + 1.22);
      bell.connect(bellGain);
      bellGain.connect(audioCtx.destination);
      bell.start(now + 0.90);
      bell.stop(now + 1.24);
    }

    // Distinct Eating Sound Effect ("nom - nom - nom" crunch + chew)
    function playEatSound() {
      if (!soundEnabled) return;
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const bites = [0.00, 0.30, 0.60];
      bites.forEach((offset, idx) => {
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.065);
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.45));
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;

        const bpf = audioCtx.createBiquadFilter();
        bpf.type = "bandpass";
        bpf.frequency.setValueAtTime(1100 + idx * 120, now + offset);
        bpf.Q.setValueAtTime(2.2, now + offset);

        const nGain = audioCtx.createGain();
        nGain.gain.setValueAtTime(0.18, now + offset);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.065);

        noise.connect(bpf);
        bpf.connect(nGain);
        nGain.connect(audioCtx.destination);
        noise.start(now + offset);

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        const basePitch = 360 + idx * 35;
        osc.frequency.setValueAtTime(basePitch, now + offset + 0.03);
        osc.frequency.exponentialRampToValueAtTime(basePitch * 0.68, now + offset + 0.21);

        gain.gain.setValueAtTime(0.001, now + offset + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.19, now + offset + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.22);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + offset + 0.03);
        osc.stop(now + offset + 0.23);
      });
    }

    function playChime(type = "sparkle") {
      if (!soundEnabled) return;
      ensureAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const sequences = {
        sparkle: [523.25, 659.25, 783.99, 1046.5],
        hello: [659.25, 880.00, 1046.50],
        wings: [659.25, 880, 1046.5, 1318.51, 1567.98],
        twirl: [523.25, 659.25, 783.99, 987.77, 1174.66, 1567.98],
        pour: [392.00, 493.88, 587.33, 783.99, 987.77, 1174.66],
        dance: [523.25, 659.25, 783.99, 1046.5, 880.00, 1046.5, 1318.51, 1567.98],
        meow: [740, 920, 660],
        hop: [420, 680, 540]
      };
      const notes = sequences[type] || sequences.sparkle;

      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i % 2 === 0 ? "sine" : "triangle";
        osc.frequency.setValueAtTime(freq, now + i * 0.065);
        gain.gain.setValueAtTime(0.001, now + i * 0.065);
        gain.gain.exponentialRampToValueAtTime(0.13, now + i * 0.065 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.065 + 0.34);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.065);
        osc.stop(now + i * 0.065 + 0.36);
      });
    }

    /* ============================================================
       3. PARTICLE CELEBRATION ENGINE
       ============================================================ */
    const fxLayer = document.getElementById("fx-layer");

    function spawnParticles(x, y, emojis = ["✨", "💖", "⭐"], count = 12) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "fx-particle";
        el.textContent = emojis[i % emojis.length];
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
        const dist = 55 + Math.random() * 95;
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        el.style.setProperty("--dy", (Math.sin(angle) * dist - 30) + "px");
        el.style.setProperty("--rot", (Math.random() * 160 - 80) + "deg");
        fxLayer.appendChild(el);
        setTimeout(() => el.remove(), 1100);
      }
    }

    function burstCenter(element, emojis, count = 14) {
      const rect = element.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, emojis, count);
    }

          ${tiaraSvg}
          ${wandSvg}
        </svg>`;
    }

    function renderAnimalSVG(animalType, expression = "happy") {
      if (animalType === "bunny") {
        const mouth = expression === "yummy" || expression === "wave"
          ? `<circle cx="100" cy="176" r="6" fill="#ff7aa8"/>`
          : `<path d="M92,173 Q96,179 100,173 Q104,179 108,173" fill="none" stroke="#b55d7c" stroke-width="2.6" stroke-linecap="round"/>`;
        const eyes = expression === "yummy"
          ? `<path d="M76,152 Q84,142 92,152" fill="none" stroke="#4a2c40" stroke-width="3.2" stroke-linecap="round"/>
             <path d="M108,152 Q116,142 124,152" fill="none" stroke="#4a2c40" stroke-width="3.2" stroke-linecap="round"/>`
          : `<circle cx="84" cy="151" r="8" fill="#5e4ae3"/>
             <circle cx="84" cy="151" r="4" fill="#1e152a"/>
             <circle cx="81.5" cy="148.5" r="2.6" fill="#fff"/>
             <circle cx="116" cy="151" r="8" fill="#5e4ae3"/>
             <circle cx="116" cy="151" r="4" fill="#1e152a"/>
             <circle cx="113.5" cy="148.5" r="2.6" fill="#fff"/>`;

        const leftPaw = expression === "wave"
          ? `<g class="wave-limb" style="transform-origin: 76px 206px;">
               <ellipse cx="46" cy="170" rx="12" ry="11" fill="#ffffff" stroke="#e5dce8" stroke-width="2.8"/>
               <circle cx="46" cy="171" r="5" fill="#ffb3d1"/>
             </g>`
          : `<ellipse cx="72" cy="216" rx="11" ry="9" fill="#ffffff" stroke="#e5dce8" stroke-width="2.5"/>`;

        return `
          <svg viewBox="0 0 200 265" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="78" cy="76" rx="15" ry="48" transform="rotate(-10 78 76)" fill="#ffffff" stroke="#e5dce8" stroke-width="3"/>
            <ellipse cx="78" cy="78" rx="8" ry="34" transform="rotate(-10 78 78)" fill="#ffb3d1"/>
            <ellipse cx="122" cy="76" rx="15" ry="48" transform="rotate(12 122 76)" fill="#ffffff" stroke="#e5dce8" stroke-width="3"/>
            <ellipse cx="122" cy="78" rx="8" ry="34" transform="rotate(12 122 78)" fill="#ffb3d1"/>
            <ellipse cx="100" cy="218" rx="36" ry="38" fill="#ffffff" stroke="#e5dce8" stroke-width="3"/>
            <ellipse cx="100" cy="222" rx="22" ry="25" fill="#fff0f6"/>
            <path d="M85,189 L100,196 L85,203 Z M115,189 L100,196 L115,203 Z" fill="#ff6b9d"/>
            <circle cx="100" cy="196" r="4.5" fill="#ffd166"/>
            ${leftPaw}
            <ellipse cx="128" cy="216" rx="11" ry="9" fill="#ffffff" stroke="#e5dce8" stroke-width="2.5"/>
            <ellipse cx="100" cy="152" rx="44" ry="38" fill="#ffffff" stroke="#e5dce8" stroke-width="3"/>
            ${eyes}
            <polygon points="95,163 105,163 100,169" fill="#ff7aa8"/>
            <ellipse cx="72" cy="164" rx="8" ry="5" fill="#ffb3d1" opacity="0.7"/>
            <ellipse cx="128" cy="164" rx="8" ry="5" fill="#ffb3d1" opacity="0.7"/>
            ${mouth}
          </svg>`;
      }

      const mouth = expression === "yummy" || expression === "wave"
        ? `<circle cx="100" cy="176" r="6" fill="#ff7aa8"/>`
        : `<path d="M92,172 Q96,178 100,172 Q104,178 108,172" fill="none" stroke="#b55d7c" stroke-width="2.6" stroke-linecap="round"/>`;
      const eyes = expression === "yummy"
        ? `<path d="M76,152 Q84,142 92,152" fill="none" stroke="#4a2c40" stroke-width="3.2" stroke-linecap="round"/>
           <path d="M108,152 Q116,142 124,152" fill="none" stroke="#4a2c40" stroke-width="3.2" stroke-linecap="round"/>`
        : `<circle cx="84" cy="151" r="8.5" fill="#00bbf9"/>
           <circle cx="84" cy="151" r="4.2" fill="#1e152a"/>
           <circle cx="81.5" cy="148.5" r="2.7" fill="#fff"/>
           <circle cx="116" cy="151" r="8.5" fill="#00bbf9"/>
           <circle cx="116" cy="151" r="4.2" fill="#1e152a"/>
           <circle cx="113.5" cy="148.5" r="2.7" fill="#fff"/>`;

      const leftPaw = expression === "wave"
        ? `<g class="wave-limb" style="transform-origin: 76px 206px;">
             <ellipse cx="46" cy="170" rx="11" ry="10.5" fill="#ffffff" stroke="#e5dce8" stroke-width="2.8"/>
             <circle cx="46" cy="171" r="4.5" fill="#ffb3d1"/>
           </g>`
        : `<ellipse cx="74" cy="218" rx="10" ry="9" fill="#ffffff" stroke="#e5dce8" stroke-width="2.5"/>`;

      return `
        <svg viewBox="0 0 200 265" xmlns="http://www.w3.org/2000/svg">
          <path d="M132,235 Q168,220 158,190 Q152,176 142,188" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
          <ellipse cx="100" cy="218" rx="35" ry="37" fill="#ffffff" stroke="#e5dce8" stroke-width="3"/>
          <path d="M74,190 Q100,200 126,190" fill="none" stroke="#ff6b9d" stroke-width="7" stroke-linecap="round"/>
          <circle cx="100" cy="197" r="6" fill="#ffd166" stroke="#fff" stroke-width="1.5"/>
          ${leftPaw}
          <ellipse cx="126" cy="218" rx="10" ry="9" fill="#ffffff" stroke="#e5dce8" stroke-width="2.5"/>
          <polygon points="62,135 66,94 94,120" fill="#ffffff" stroke="#e5dce8" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="68,128 70,103 88,120" fill="#ffb3d1"/>
          <polygon points="138,135 134,94 106,120" fill="#ffffff" stroke="#e5dce8" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="132,128 130,103 112,120" fill="#ffb3d1"/>
          <path d="M84,116 L89,101 L96,110 L100,97 L104,110 L111,101 L116,116 Z" fill="#ffd166" stroke="#fff" stroke-width="1.8"/>
          <ellipse cx="100" cy="153" rx="43" ry="37" fill="#ffffff" stroke="#e5dce8" stroke-width="3"/>
          ${eyes}
          <line x1="50" y1="154" x2="68" y2="157" stroke="#cbb8d1" stroke-width="2" stroke-linecap="round"/>
          <line x1="50" y1="164" x2="68" y2="163" stroke="#cbb8d1" stroke-width="2" stroke-linecap="round"/>
          <line x1="150" y1="154" x2="132" y2="157" stroke="#cbb8d1" stroke-width="2" stroke-linecap="round"/>
          <line x1="150" y1="164" x2="132" y2="163" stroke="#cbb8d1" stroke-width="2" stroke-linecap="round"/>
          <polygon points="96,163 104,163 100,168" fill="#ff7aa8"/>
          <ellipse cx="72" cy="164" rx="7.5" ry="4.5" fill="#ffb3d1" opacity="0.7"/>
          <ellipse cx="128" cy="164" rx="7.5" ry="4.5" fill="#ffb3d1" opacity="0.7"/>
          ${mouth}
        </svg>`;
    }

    /* ============================================================
       5. GAME STATE & RENDERING
       ============================================================ */
    const state = {
      screen: "select",
      selectedPrincess: "elsa",
      outfit: { dress: 0, tiara: 0, accessory: 0, wand: 0, aura: 0 },
      guests: [
        { type: "animal", id: "bunny" },
        { type: "animal", id: "kitten" },
        { type: "princess", id: "rapunzel" }
      ],
      tableFood: ["🥪", "🍰", "🧁", "🥪"],
      foodConsumed: [false, false, false, false],
      teaPoured: [false, false, false, false]
    };

    const topBar = document.getElementById("top-bar");
    const screens = {
      select: document.getElementById("screen-select"),
      dressup: document.getElementById("screen-dressup"),
      teaparty: document.getElementById("screen-teaparty")
    };

    function switchScreen(target) {
      clearTeaTimers();
      state.screen = target;
      Object.entries(screens).forEach(([key, el]) => {
        el.classList.toggle("active", key === target);
      });
      topBar.style.display = target === "select" ? "none" : "flex";
      document.getElementById("tab-dressup").classList.toggle("active", target === "dressup");
      document.getElementById("tab-teaparty").classList.toggle("active", target === "teaparty");

      if (target === "dressup") renderDressUpHero();
      if (target === "teaparty") {
        ensureValidDefaultFriend();
        renderTeaParty();
      }
    }

    function buildSelectGrid() {
      const grid = document.getElementById("princess-grid");
      grid.innerHTML = "";
      PRINCESSES.forEach((p) => {
        const card = document.createElement("button");
        card.className = "princess-card";
        card.style.background = p.cardBg;
        card.innerHTML = `
          <div class="princess-card-art">${renderPrincessSVG(p.id, { dress: 0, tiara: 0, accessory: 0, wand: 0, aura: 0 }, "happy")}</div>
          <div class="princess-card-label">${p.name}</div>
        `;
        card.addEventListener("click", () => {
          state.selectedPrincess = p.id;
          state.outfit = { dress: 0, tiara: 0, accessory: 0, wand: 0, aura: 0 };
          playChime("sparkle");
          burstCenter(card, ["✨", "💖", "👑"], 14);
          switchScreen("dressup");
        });
        grid.appendChild(card);
      });
    }

    // Dress-Up Hero Rendering & Animations
    const heroWrap = document.getElementById("hero-princess-wrap");

    function renderDressUpHero(expression = "happy", animClass = "pop-bounce") {
      heroWrap.innerHTML = renderPrincessSVG(state.selectedPrincess, state.outfit, expression);
      heroWrap.classList.remove("twirling", "pop-bounce");
      void heroWrap.offsetWidth;
      if (animClass) heroWrap.classList.add(animClass);
    }

    heroWrap.addEventListener("click", () => {
      playChime("twirl");
      renderDressUpHero("excited", "twirling");
      burstCenter(heroWrap, ["💖", "✨", "🌸", "👑"], 18);
    });

    document.getElementById("btn-dress").addEventListener("click", () => {
      const totalGowns = 1 + BONUS_GOWNS.length;
      state.outfit.dress = (state.outfit.dress + 1) % totalGowns;
      playChime("sparkle");
      renderDressUpHero("excited", "pop-bounce");
      burstCenter(heroWrap, ["👗", "✨", "💖"], 14);
    });

    document.getElementById("btn-crown").addEventListener("click", () => {
      state.outfit.tiara = (state.outfit.tiara + 1) % TIARAS.length;
      playChime("sparkle");
      renderDressUpHero("excited", "pop-bounce");
      burstCenter(heroWrap, ["👑", "✨", "💎"], 14);
    });

    document.getElementById("btn-accessory").addEventListener("click", () => {
      state.outfit.accessory = (state.outfit.accessory + 1) % ACCESSORIES.length;
      playChime("wings");
      renderDressUpHero("excited", "pop-bounce");
      burstCenter(heroWrap, ["🧚", "🦋", "💖", "✨"], 16);
    });

    document.getElementById("btn-wand").addEventListener("click", () => {
      state.outfit.wand = (state.outfit.wand + 1) % WANDS.length;
      playChime("sparkle");
      renderDressUpHero("excited", "pop-bounce");
      burstCenter(heroWrap, ["🪄", "⭐", "✨"], 14);
    });

    document.getElementById("btn-aura").addEventListener("click", () => {
      state.outfit.aura = (state.outfit.aura + 1) % AURAS.length;
      playChime("sparkle");
      renderDressUpHero("excited", "pop-bounce");
      burstCenter(heroWrap, ["🦋", "💖", "✨"], 14);
    });

    document.getElementById("btn-twirl").addEventListener("click", () => {
      playChime("twirl");
      renderDressUpHero("excited", "twirling");
      burstCenter(heroWrap, ["✨", "💖", "👑", "🌸", "⭐"], 22);
    });

    /* ============================================================
       6. TEA PARTY: WAVE GREETING, DRINKING & CLEARING CUPS, EATING
       ============================================================ */
    let teaSequenceTimers = [];

    function clearTeaTimers() {
      teaSequenceTimers.forEach(t => clearTimeout(t));
      teaSequenceTimers = [];
      for (let i = 0; i < 4; i++) {
        const charEl = document.getElementById(`seat-char-${i}`);
        if (charEl) {
          charEl.classList.remove("sipping-tea", "chewing-food", "dancing-happy", "happy-react", "waving-hello");
          charEl.querySelectorAll(".single-mouth-item").forEach(el => el.remove());
        }
      }
    }

    function getGuestCyclePool() {
      const pool = [
        { type: "animal", id: "bunny", emoji: "🐰" },
        { type: "animal", id: "kitten", emoji: "🐱" }
      ];
      PRINCESSES.forEach((p) => {
        if (p.id !== state.selectedPrincess) {
          pool.push({ type: "princess", id: p.id, emoji: "👑" });
        }
      });
      return pool;
    }

    function ensureValidDefaultFriend() {
      const g3 = state.guests[2];
      if (g3.type === "princess" && g3.id === state.selectedPrincess) {
        const alt = PRINCESSES.find(p => p.id !== state.selectedPrincess);
        state.guests[2] = { type: "princess", id: alt.id };
      }
    }

    function renderSeatCharacter(seatIndex, expression = "happy") {
      const container = document.getElementById(`seat-char-${seatIndex}`);
      if (!container) return;
      if (seatIndex === 0) {
        container.innerHTML = renderPrincessSVG(state.selectedPrincess, state.outfit, expression);
      } else {
        const g = state.guests[seatIndex - 1];
        if (g.type === "animal") {
          container.innerHTML = renderAnimalSVG(g.id, expression);
        } else {
          container.innerHTML = renderPrincessSVG(g.id, { dress: 0, tiara: 1, accessory: 0, wand: 0, aura: 0 }, expression);
        }
      }
    }

    function renderTeaParty() {
      for (let i = 0; i < 4; i++) {
        renderSeatCharacter(i, "happy");
        const cup = document.getElementById(`cup-${i}`);
        const treat = document.getElementById(`treat-${i}`);

        if (state.teaPoured[i]) {
          cup.textContent = "🍵";
          cup.classList.remove("cleared");
          cup.classList.add("filled");
        } else {
          cup.textContent = "";
          cup.classList.remove("filled");
          cup.classList.add("cleared");
        }

        treat.textContent = state.foodConsumed[i] ? "🍽️" : state.tableFood[i];
        treat.classList.toggle("consumed", state.foodConsumed[i]);
      }

      document.querySelectorAll(".guest-swap-pill").forEach((btn) => {
        const seatIdx = Number(btn.dataset.seat);
        const g = state.guests[seatIdx - 1];
        const icon = g.id === "bunny" ? "🐰" : g.id === "kitten" ? "🐱" : "👑";
        btn.innerHTML = `<span>${icon}</span><span>Swap</span>`;
      });
    }

    // Guest Swap Buttons
    document.querySelectorAll(".guest-swap-pill").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        clearTeaTimers();
        const seatIdx = Number(btn.dataset.seat);
        const pool = getGuestCyclePool();
        const current = state.guests[seatIdx - 1];
        const curIdx = pool.findIndex(item => item.type === current.type && item.id === current.id);
        const next = pool[(curIdx + 1) % pool.length];
        state.guests[seatIdx - 1] = { type: next.type, id: next.id };

        renderTeaParty();
        const charEl = document.getElementById(`seat-char-${seatIdx}`);
        charEl.classList.remove("happy-react");
        void charEl.offsetWidth;
        charEl.classList.add("happy-react");

        if (next.id === "kitten") playChime("meow");
        else if (next.id === "bunny") playChime("hop");
        else playChime("sparkle");

        burstCenter(charEl, [next.emoji, "✨", "💖"], 12);
      });
    });

    // Helper: Animate 1 single food/drink item going to a character's mouth
    function animateSingleMouthItem(seatIndex, emoji, mode = "eat") {
      const charEl = document.getElementById(`seat-char-${seatIndex}`);
      if (!charEl) return;
      renderSeatCharacter(seatIndex, "yummy");
      charEl.classList.remove("sipping-tea", "chewing-food", "dancing-happy", "happy-react", "waving-hello");
      void charEl.offsetWidth;
      charEl.classList.add(mode === "drink" ? "sipping-tea" : "chewing-food");

      const itemEl = document.createElement("span");
      itemEl.className = `single-mouth-item ${mode === "drink" ? "drink-anim" : "eat-anim"}`;
      itemEl.textContent = emoji;
      charEl.appendChild(itemEl);
    }

    // Happy Dance Helper for selected seats (defaults to all 4 seats)
    function triggerHappyDanceForSeats(seatIndices = [0, 1, 2, 3], durationMs = 2200) {
      playChime("dance");
      seatIndices.forEach((i) => {
        renderSeatCharacter(i, "excited");
        const charEl = document.getElementById(`seat-char-${i}`);
        if (!charEl) return;
        charEl.querySelectorAll(".single-mouth-item").forEach(el => el.remove());
        charEl.classList.remove("sipping-tea", "chewing-food", "happy-react", "waving-hello");
        charEl.classList.add("dancing-happy");
      });

      const endDance = setTimeout(() => {
        seatIndices.forEach((i) => {
          const charEl = document.getElementById(`seat-char-${i}`);
          if (charEl) charEl.classList.remove("dancing-happy");
          renderSeatCharacter(i, "happy");
        });
      }, durationMs);
      teaSequenceTimers.push(endDance);
    }

    // Tapping a character makes them WAVE HELLO, then the REST of the characters dance happy!
    function greetGuestThenOthersDance(seatIndex) {
      clearTeaTimers();
      renderTeaParty();

      // Clicked guest waves hello
      renderSeatCharacter(seatIndex, "wave");
      const waverEl = document.getElementById(`seat-char-${seatIndex}`);
      if (waverEl) waverEl.classList.add("waving-hello");

      if (seatIndex > 0 && state.guests[seatIndex - 1].id === "kitten") playChime("meow");
      else if (seatIndex > 0 && state.guests[seatIndex - 1].id === "bunny") playChime("hop");
      else playChime("hello");

      // After waving, the REST of the characters dance happy
      const othersDanceTimer = setTimeout(() => {
        if (waverEl) waverEl.classList.remove("waving-hello");
        renderSeatCharacter(seatIndex, "happy");
        const otherSeats = [0, 1, 2, 3].filter(idx => idx !== seatIndex);
        triggerHappyDanceForSeats(otherSeats, 2100);
      }, 950);

      teaSequenceTimers.push(othersDanceTimer);
    }

    for (let i = 0; i < 4; i++) {
      document.getElementById(`seat-char-${i}`).addEventListener("click", () => {
        greetGuestThenOthersDance(i);
      });
    }

    // Tapping a food item directly on a place setting lets that guest eat 1 snack, then all dance happy
    function feedSingleGuestThenAllDance(seatIndex) {
      clearTeaTimers();
      const snack = state.tableFood[seatIndex] || "🧁";
      state.foodConsumed[seatIndex] = true;
      renderTeaParty();

      playEatSound();
      animateSingleMouthItem(seatIndex, snack, "eat");

      const danceTimer = setTimeout(() => {
        triggerHappyDanceForSeats([0, 1, 2, 3], 2100);
      }, 1250);
      teaSequenceTimers.push(danceTimer);
    }

    document.querySelectorAll(".place-setting").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const idx = Number(el.dataset.place);
        feedSingleGuestThenAllDance(idx);
      });
    });

    // Teapot Click:
    // 1) Pour Tea onto table -> 2) Guests pick up & drink tea (clearing cups from table) -> 3) ALL dance happy!
    function triggerPourDrinkAndDance() {
      clearTeaTimers();
      const pot = document.getElementById("teapot-center");
      pot.classList.remove("pouring");
      void pot.offsetWidth;
      pot.classList.add("pouring");

      playChime("pour");
      state.teaPoured = [true, true, true, true];
      renderTeaParty();

      // Phase 2: All 4 guests pick up their cup to drink (clearing the teacups off the table)
      const sipTimer = setTimeout(() => {
        state.teaPoured = [false, false, false, false];
        renderTeaParty();
        playDrinkSound();
        for (let i = 0; i < 4; i++) {
          animateSingleMouthItem(i, "🍵", "drink");
        }
      }, 750);

      // Phase 3: All 4 guests dance happy with the table cleared of teacups
      const danceTimer = setTimeout(() => {
        triggerHappyDanceForSeats([0, 1, 2, 3], 2300);
      }, 2100);

      teaSequenceTimers.push(sipTimer, danceTimer);
    }

    document.getElementById("teapot-center").addEventListener("click", triggerPourDrinkAndDance);
    document.getElementById("btn-tea-pour").addEventListener("click", triggerPourDrinkAndDance);

    // Sandwiches / Dessert Click:
    // 1) Serve snack -> 2) Each guest eats 1 single food item -> 3) ALL guests dance happy!
    function serveAndConsumeSnack(snackEmoji, platterId) {
      clearTeaTimers();
      const platter = document.getElementById(platterId);
      if (platter) {
        platter.classList.remove("nibbled");
        void platter.offsetWidth;
        platter.classList.add("nibbled");
      }

      state.tableFood = [snackEmoji, snackEmoji, snackEmoji, snackEmoji];
      state.foodConsumed = [false, false, false, false];
      renderTeaParty();

      for (let i = 0; i < 4; i++) {
        const treatEl = document.getElementById(`treat-${i}`);
        treatEl.classList.remove("pop-in");
        void treatEl.offsetWidth;
        treatEl.classList.add("pop-in");
      }

      const eatTimer = setTimeout(() => {
        playEatSound();
        state.foodConsumed = [true, true, true, true];
        renderTeaParty();
        for (let i = 0; i < 4; i++) {
          animateSingleMouthItem(i, snackEmoji, "eat");
        }
      }, 450);

      const danceTimer = setTimeout(() => {
        triggerHappyDanceForSeats([0, 1, 2, 3], 2300);
      }, 1700);

      teaSequenceTimers.push(eatTimer, danceTimer);
    }

    document.getElementById("platter-sandwiches").addEventListener("click", () => {
      serveAndConsumeSnack("🥪", "platter-sandwiches");
    });
    document.getElementById("btn-tea-sandwich").addEventListener("click", () => {
      serveAndConsumeSnack("🥪", "platter-sandwiches");
    });

    document.getElementById("platter-dessert").addEventListener("click", () => {
      serveAndConsumeSnack("🍰", "platter-dessert");
    });
    document.getElementById("btn-tea-dessert").addEventListener("click", () => {
      serveAndConsumeSnack("🍰", "platter-dessert");
    });

    document.getElementById("btn-tea-dance").addEventListener("click", () => {
      clearTeaTimers();
      triggerHappyDanceForSeats([0, 1, 2, 3], 2400);
    });

    /* ============================================================
       7. TOP BAR NAVIGATION & AUDIO TOGGLE
       ============================================================ */
    document.getElementById("btn-back-princess").addEventListener("click", () => {
      playChime("sparkle");
      switchScreen("select");
    });

    document.getElementById("tab-dressup").addEventListener("click", () => {
      playChime("sparkle");
      switchScreen("dressup");
    });

    document.getElementById("tab-teaparty").addEventListener("click", () => {
      playChime("sparkle");
      switchScreen("teaparty");
    });

    document.getElementById("btn-sound").addEventListener("click", (e) => {
      soundEnabled = !soundEnabled;
      e.currentTarget.textContent = soundEnabled ? "🎵" : "🔇";
      if (soundEnabled) {
        ensureAudio();
        playChime("sparkle");
      } else {
        stopPrincessMusic();
      }
    });

    buildSelectGrid();
  </script>
</body>
</html>
