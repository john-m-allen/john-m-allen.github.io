<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#7dd3fc">
  <title>Pokémon Sleep Campsite — Little Explorer Mode</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #7dd3fc; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #load-message { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: #334155; font: 700 20px/1.4 system-ui, sans-serif; text-align: center; pointer-events: none; }
  </style>
</head>
<body>
  <div id="load-message">Getting the campsite ready… 🌿</div>
  <iframe id="game" title="Pokémon Sleep campsite game" src="./index.html"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('game');
      const message = document.getElementById('load-message');

      frame.addEventListener('load', () => {
        message.remove();
        try {
          const doc = frame.contentDocument;
          const style = doc.createElement('style');
          style.textContent = `
            /* Big, forgiving touch targets without changing game actions. */
            button {
              min-height: 52px !important;
              touch-action: manipulation !important;
              -webkit-tap-highlight-color: transparent !important;
              transition: transform 140ms ease, filter 140ms ease, box-shadow 140ms ease !important;
            }
            button:active {
              transform: scale(.94) !important;
              filter: brightness(1.12) saturate(1.12) !important;
              box-shadow: 0 0 0 5px rgba(251, 191, 36, .34), 0 5px 0 rgba(15, 23, 42, .12) !important;
            }
            button:focus-visible {
              outline: 4px solid #fbbf24 !important;
              outline-offset: 3px !important;
            }
            #btn-theme-toggle, #btn-sound-toggle, #btn-reset-open,
            #btn-close-party, #btn-close-cook { min-width: 52px !important; min-height: 52px !important; }
            #btn-open-party, #btn-open-cook { min-height: 64px !important; font-size: 17px !important; }
            [data-toggle-poke], [data-slot-remove], [data-bag-poke], [data-cook-recipe] {
              min-height: 58px !important;
              touch-action: manipulation !important;
            }
            #game-canvas { transition: filter 140ms ease; }
            #game-canvas.tap-glow { filter: brightness(1.14) saturate(1.14); }
            #onboarding-pill > div {
              font-size: 15px !important;
              padding: 10px 16px !important;
              border-radius: 999px !important;
            }
            @media (prefers-reduced-motion: reduce) {
              *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
            }
          `;
          doc.head.appendChild(style);

          const canvas = doc.getElementById('game-canvas');
          if (canvas) {
            canvas.addEventListener('pointerdown', () => {
              canvas.classList.add('tap-glow');
              setTimeout(() => canvas.classList.remove('tap-glow'), 180);
            }, { passive: true });
          }

          const labels = {
            'btn-theme-toggle': 'Change between day and night',
            'btn-sound-toggle': 'Turn game sounds on or off',
            'btn-reset-open': 'Reset camp progress',
            'btn-open-party': 'Choose your Pokémon helpers',
            'btn-open-cook': 'Open the cooking pot'
          };
          Object.entries(labels).forEach(([id, label]) => {
            const button = doc.getElementById(id);
            if (button) button.setAttribute('aria-label', label);
          });
        } catch (error) {
          // The original game remains usable if browser frame access is restricted.
          console.warn('Little Explorer Mode could not apply its touch enhancements.', error);
        }
      });
    })();
  </script>
</body>
</html>
