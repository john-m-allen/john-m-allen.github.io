<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7dd3fc">
  <title>Pokémon Sleep 3D — Cozy Campsite & Cooking</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#7dd3fc;font-family:Nunito,system-ui,sans-serif}.font-display{font-family:Fredoka,system-ui,sans-serif}#game-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none}.glass{background:rgba(255,255,255,.92);backdrop-filter:blur(12px)}.hidden{display:none!important}.pop{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}button{touch-action:manipulation}
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="3D Pokémon campsite"></canvas>
  <div id="error" class="hidden fixed inset-0 z-50 grid place-items-center p-6"><div class="glass max-w-md rounded-3xl border-4 border-rose-300 p-6 text-center shadow-xl"><h1 class="font-display text-2xl font-bold">Campsite couldn't start</h1><p class="mt-2 text-slate-600">The 3D library did not load. Check your internet connection and reload the page.</p></div></div>
  <header class="fixed inset-x-0 top-0 z-10 flex items-start justify-between gap-2 p-3 sm:p-4 pointer-events-none">
    <div class="glass pointer-events-auto flex max-w-[330px] flex-1 items-center gap-3 rounded-2xl border-2 border-amber-200 p-2.5 shadow-lg">
      <div class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 text-white"><span class="text-[9px] font-black">RANK</span><b id="rank" class="font-display">B-1</b></div>
      <div class="min-w-0 flex-1"><div class="flex justify-between gap-2"><b id="rank-name" class="font-display truncate">Basic 1</b><b>⚡ <span id="strength">0</span></b></div><div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-200"><div id="progress" class="h-full rounded-full bg-gradient-to-r from-amber-400 to-rose-400" style="width:0%"></div></div><div class="mt-0.5 flex justify-between text-[10px] font-bold text-slate-500"><span>Snorlax Strength</span><span id="next-rank">Next: 1,200</span></div></div>
    </div>
    <div class="pointer-events-auto flex gap-1.5"><button id="theme" class="glass rounded-xl border-b-4 border-slate-300 px-3 py-2 font-bold">☀️</button><button id="mute" class="glass rounded-xl border-b-4 border-slate-300 px-3 py-2">🔊</button><button id="reset" class="glass rounded-xl border-b-4 border-slate-300 px-3 py-2 text-rose-600">↻</button></div>
  </header>
  <div id="tip" class="fixed left-1/2 top-[76px] z-10 -translate-x-1/2 rounded-full bg-slate-900/80 px-4 py-1.5 text-center text-xs font-bold text-white shadow">Tap Pokémon to gather • Cook a meal for Snorlax!</div>
  <div id="toast" class="fixed left-1/2 top-20 z-30 -translate-x-1/2 rounded-full bg-slate-900/90 px-4 py-2 text-sm font-bold text-white opacity-0 transition-opacity"></div>
  <footer class="fixed inset-x-0 bottom-0 z-10 p-2.5 sm:p-4"><div class="glass mx-auto max-w-3xl rounded-3xl border-2 border-amber-200 p-2.5 shadow-2xl">
    <div class="mb-1 flex justify-between px-1 text-[11px] font-bold text-slate-600"><span>🧺 Ingredient bag</span><span>Total: <b id="total">0</b></span></div><div id="bag" class="no-scrollbar flex gap-1.5 overflow-x-auto"></div>
    <div class="mt-2 grid grid-cols-2 gap-2"><button id="party-btn" class="rounded-2xl border-b-4 border-indigo-800 bg-indigo-600 py-3 font-display font-bold text-white">👥 Party (<span id="party-count">5</span>/5)</button><button id="cook-btn" class="rounded-2xl border-b-4 border-orange-800 bg-gradient-to-b from-amber-400 to-orange-600 py-3 font-display font-bold text-white">🍲 Cook Meal <span id="ready" class="hidden rounded-full bg-emerald-500 px-2 text-xs">Ready!</span></button></div>
  </div></footer>
  <div id="modal" class="hidden fixed inset-0 z-20 items-end justify-center bg-slate-950/60 p-0 backdrop-blur-sm sm:items-center sm:p-4"><section class="pop glass max-h-[85dvh] w-full max-w-xl overflow-hidden rounded-t-3xl border-4 border-amber-200 sm:rounded-3xl"><div class="flex items-center justify-between bg-gradient-to-r from-amber-500 to-rose-500 p-4 text-white"><div><h2 id="modal-title" class="font-display text-xl font-bold">Cooking Pot</h2><p id="modal-subtitle" class="text-xs">Gather ingredients to cook!</p></div><button id="close" class="rounded-full bg-white/20 px-3 py-1 text-lg">✕</button></div><div id="modal-content" class="max-h-[65dvh] space-y-2 overflow-y-auto p-3"></div></section></div>
  <script>
  (()=>{
    'use strict';
    const errorBox=document.getElementById('error');
    if(!window.THREE){errorBox.classList.remove('hidden');return;}
    const names=['Pikachu','Eevee','Espeon','Fuecoco','Applin','Gengar','Blastoise','Zapdos','Mew'];
    const ids=['pikachu','eevee','espeon','fuecoco','applin','gengar','blastoise','zapdos','mew'];
    const emojis=['⚡','🦊','✨','🐊','🍎','👻','🐢','🐤','💗'];
    const colors=[0xfacc15,0xb45309,0xd8b4fe,0xef4444,0xf87171,0x6366f1,0x38bdf8,0xfbbf24,0xf9a8d4];
    const ingredients=['Spark Cheese','Sunlit Wheat','Mystic Egg','Blaze Tomato','Crisp Apple','Shadow Beef','Hydro Rice','Thunder Chicken','Creamy Milk'];
    const recipes=[{name:'Pizza',emoji:'🍕',power:1200,need:{1:2,0:2,3:1}},{name:'Hamburger',emoji:'🍔',power:1400,need:{1:2,5:2,3:1}},{name:'Teriyaki Chicken & Rice',emoji:'🍛',power:1500,need:{7:2,6:2,4:1}},{name:'Mac and Cheese',emoji:'🧀',power:1350,need:{1:2,0:2,8:1}},{name:'Waffles',emoji:'🧇',power:1450,need:{1:2,2:1,8:1,4:1}}];
    const key='pokemon_sleep_3d_camp_v2';let state;
    function defaults(){return{party:[0,1,2,3,4],bag:Array(9).fill(0),strength:0,night:false,muted:false};}
    try{state={...defaults(),...JSON.parse(localStorage.getItem(key)||'{}')};state.party=Array.isArray(state.party)?state.party.filter(i=>Number.isInteger(i)&&i>=0&&i<9).slice(0,5):defaults().party;state.bag=Array.isArray(state.bag)&&state.bag.length===9?state.bag.map(n=>Math.max(0,Number(n)||0)):defaults().bag;}catch{state=defaults();}
    const save=()=>{try{localStorage.setItem(key,JSON.stringify(state));}catch{}};
    const scene=new THREE.Scene(),day=new THREE.Color(0x7dd3fc),night=new THREE.Color(0x172554);scene.background=day.clone();scene.fog=new THREE.Fog(0x9bdcf6,18,42);
    const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,11,16);camera.lookAt(0,1,0);
    const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game-canvas'),antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;
    scene.add(new THREE.HemisphereLight(0xe0f2fe,0x365314,1.3));const sun=new THREE.DirectionalLight(0xfff3d0,2);sun.position.set(-5,12,8);sun.castShadow=true;scene.add(sun);
    const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
    const ground=new THREE.Mesh(new THREE.CircleGeometry(17,48),mat(0x62bd58));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    const blanket=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.3,.12,32),mat(0xfde68a));blanket.position.set(0,.08,-1.2);blanket.receiveShadow=true;scene.add(blanket);
    for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=11+(i%3),tree=new THREE.Group();tree.position.set(Math.cos(a)*r,0,Math.sin(a)*r-1);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.32,1.5,8),mat(0x854d0e));trunk.position.y=.75;const crown=new THREE.Mesh(new THREE.ConeGeometry(1.2,2.7,8),mat(i%2?0x15803d:0x16a34a));crown.position.y=2.5;trunk.castShadow=crown.castShadow=true;tree.add(trunk,crown);scene.add(tree);}
    const campfire=new THREE.Group();campfire.position.set(-3,0,2.8);scene.add(campfire);const fire=new THREE.Mesh(new THREE.ConeGeometry(.48,1.25,8),new THREE.MeshBasicMaterial({color:0xfb923c}));fire.position.y=.65;campfire.add(fire);const pot=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),mat(0x334155,.35));pot.scale.y=.7;pot.position.set(0,1.6,0);pot.castShadow=true;campfire.add(pot);const cookHit=new THREE.Mesh(new THREE.SphereGeometry(1.4,8,8),new THREE.MeshBasicMaterial({visible:false}));cookHit.position.set(0,1.4,0);cookHit.userData.cook=true;campfire.add(cookHit);
    const snorlax=new THREE.Group();snorlax.position.set(0,0,-1.4);scene.add(snorlax);const teal=mat(0x287485),cream=mat(0xfef3c7);const torso=new THREE.Mesh(new THREE.SphereGeometry(1.7,24,18),teal);torso.scale.set(1.2,.9,1);torso.position.y=1.35;torso.castShadow=true;snorlax.add(torso);const belly=new THREE.Mesh(new THREE.SphereGeometry(1.28,24,18),cream);belly.scale.set(1.05,.8,.55);belly.position.set(0,1.2,.8);snorlax.add(belly);const snHit=new THREE.Mesh(new THREE.SphereGeometry(2.4,8,8),new THREE.MeshBasicMaterial({visible:false}));snHit.position.y=1.2;snHit.userData.cook=true;snorlax.add(snHit);
    const models=[];function addPokemon(id,index){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.SphereGeometry(.48,18,14),mat(colors[id])),head=new THREE.Mesh(new THREE.SphereGeometry(.38,18,14),mat(colors[id]));body.position.y=.55;head.position.set(0,1.15,.05);body.castShadow=head.castShadow=true;g.add(body,head);for(const s of [-1,1]){const ear=new THREE.Mesh(new THREE.ConeGeometry(.12,.38,8),mat(colors[id]));ear.position.set(s*.23,1.48,0);ear.rotation.z=-s*.35;g.add(ear);}const badge=new THREE.Sprite(new THREE.SpriteMaterial({map:textureLabel(emojis[id]+' '+names[id]),transparent:true}));badge.position.y=1.9;badge.scale.set(1.8,.48,1);g.add(badge);const hit=new THREE.Mesh(new THREE.SphereGeometry(1.1,10,10),new THREE.MeshBasicMaterial({visible:false}));hit.position.y=.8;hit.userData.pokemon=id;g.add(hit);const angle=index/5*Math.PI*2,pos=new THREE.Vector3(Math.cos(angle)*4.5,0,Math.sin(angle)*3.6+1);g.position.copy(pos);scene.add(g);models.push({id,g,body,hit,pos,target:null,phase:index});}
    function textureLabel(text){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 34px sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=7;x.strokeStyle='#ffffff';x.strokeText(text,128,34);x.fillStyle='#153047';x.fillText(text,128,34);return new THREE.CanvasTexture(c);}
    function syncParty(){models.forEach(m=>scene.remove(m.g));models.length=0;state.party.forEach((id,i)=>addPokemon(id,i));}
    const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let toastTimer;
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,2200);}
    function popup(obj,text){const p=obj.clone();p.project(camera);const el=document.createElement('div');el.className='fixed z-10 rounded-full border-2 border-amber-300 bg-white px-3 py-1 font-bold shadow';el.textContent=text;el.style.left=((p.x*.5+.5)*innerWidth)+'px';el.style.top=((-p.y*.5+.5)*innerHeight)+'px';el.style.transform='translate(-50%,-50%)';document.body.appendChild(el);el.animate([{opacity:1,transform:'translate(-50%,-50%)'},{opacity:0,transform:'translate(-50%,-180%)'}],{duration:900}).onfinish=()=>el.remove();}
    function tap(x,y){ndc.set(x/innerWidth*2-1,-y/innerHeight*2+1);ray.setFromCamera(ndc,camera);const hits=ray.intersectObjects([...models.map(m=>m.hit),cookHit,snHit],false);if(!hits.length)return;const d=hits[0].object.userData;if(d.cook)openModal('cook');else gather(d.pokemon);}
    renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===undefined||e.button===0)tap(e.clientX,e.clientY);});
    const rankEls={rank:document.getElementById('rank'),name:document.getElementById('rank-name'),strength:document.getElementById('strength'),progress:document.getElementById('progress'),next:document.getElementById('next-rank')};
    const bagEl=document.getElementById('bag'),modal=document.getElementById('modal'),content=document.getElementById('modal-content');let modalMode='cook';
    function render(){let total=0;bagEl.innerHTML=ids.map((id,i)=>{total+=state.bag[i];return `<button class="shrink-0 rounded-xl border px-2 py-1 text-center ${state.party.includes(i)?'border-emerald-300 bg-emerald-50':'border-slate-200 bg-slate-50'}"><div>${emojis[i]} <b>${state.bag[i]}</b></div><small>${ingredients[i].split(' ')[0]}</small></button>`;}).join('');document.getElementById('total').textContent=total;document.getElementById('party-count').textContent=state.party.length;const ranks=[[0,'Basic 1','B-1'],[1200,'Basic 2','B-2'],[2500,'Basic 3','B-3'],[4000,'Basic 4','B-4'],[5800,'Basic 5','B-5'],[8000,'Great 1','G-1'],[10500,'Great 2','G-2'],[13500,'Great 3','G-3'],[17000,'Great 4','G-4'],[21000,'Great 5','G-5'],[25500,'Ultra 1','U-1'],[30500,'Ultra 2','U-2'],[36000,'Ultra 3','U-3'],[42000,'Ultra 4','U-4'],[49000,'Ultra 5','U-5'],[57000,'Master 1','M-1']];let r=0;while(r<ranks.length-1&&state.strength>=ranks[r+1][0])r++;rankEls.rank.textContent=ranks[r][2];rankEls.name.textContent=ranks[r][1];rankEls.strength.textContent=state.strength.toLocaleString();const next=ranks[r+1];rankEls.next.textContent=next?`Next: ${next[0].toLocaleString()}`:'Camp champion!';rankEls.progress.style.width=next?Math.min(100,(state.strength-ranks[r][0])/(next[0]-ranks[r][0])*100)+'%':'100%';document.getElementById('ready').classList.toggle('hidden',!recipes.some(canCook));document.getElementById('theme').textContent=state.night?'🌙':'☀️';document.getElementById('mute').textContent=state.muted?'🔇':'🔊';}
    function gather(i){state.bag[i]++;save();render();document.getElementById('tip').classList.add('hidden');popup(models.find(m=>m.id===i).g.position.clone().setY(2),`+1 ${emojis[i]} ${ingredients[i]}`);if(!state.muted)tone(POKEMON_DATA[ids[i]].pitch);}
    let audio;function tone(freq){try{audio=audio||new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.value=.12;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.21);}catch{}}
    function canCook(r){return Object.entries(r.need).every(([i,n])=>state.bag[i]>=n);}
    function openModal(mode){modalMode=mode;modal.classList.remove('hidden');modal.classList.add('flex');renderModal();}
    function closeModal(){modal.classList.add('hidden');modal.classList.remove('flex');}
    function renderModal(){const title=document.getElementById('modal-title'),sub=document.getElementById('modal-subtitle');if(modalMode==='party'){title.textContent='Campsite Party';sub.textContent='Choose up to five Pokémon helpers.';content.innerHTML=ids.map((id,i)=>`<button data-party="${i}" class="flex w-full items-center justify-between rounded-2xl border-2 p-3 text-left ${state.party.includes(i)?'border-indigo-400 bg-indigo-50':'border-slate-200 bg-white'}"><span class="font-bold">${emojis[i]} ${names[i]} <small class="text-slate-500">${ingredients[i]}</small></span><b>${state.party.includes(i)?'Active':'Add'}</b></button>`).join('');content.querySelectorAll('[data-party]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.party),at=state.party.indexOf(i);if(at>=0){if(state.party.length>1)state.party.splice(at,1);}else if(state.party.length<5)state.party.push(i);else toast('Party is full. Remove one first.');save();syncParty();render();renderModal();});}else{title.textContent="Snorlax's Cooking Pot";sub.textContent='Cook a meal to increase Snorlax strength!';content.innerHTML=recipes.map((r,i)=>`<article class="rounded-2xl border-2 ${canCook(r)?'border-amber-400':'border-slate-200'} bg-white p-3"><div class="flex items-center justify-between gap-2"><div><b class="font-display text-lg">${r.emoji} ${r.name}</b><div class="text-xs font-bold text-amber-700">+${r.power.toLocaleString()} strength</div></div><button data-recipe="${i}" ${canCook(r)?'':'disabled'} class="rounded-xl px-4 py-2 font-bold ${canCook(r)?'bg-orange-500 text-white':'bg-slate-200 text-slate-400'}">Cook</button></div><div class="mt-2 flex flex-wrap gap-1">${Object.entries(r.need).map(([id,n])=>`<span class="rounded-lg px-2 py-1 text-xs ${state.bag[id]>=n?'bg-emerald-100':'bg-rose-50'}">${emojis[id]} ${state.bag[id]}/${n}</span>`).join('')}</div></article>`).join('');content.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>cook(Number(b.dataset.recipe)));}}
    let cutsceneTimer=0;function cook(i){const r=recipes[i];if(!canCook(r))return;Object.entries(r.need).forEach(([id,n])=>state.bag[id]-=n);const gain=r.power*(Math.random()<.25?2:1);state.strength+=gain;save();render();closeModal();cutsceneTimer=3;document.getElementById('bottom-dock').classList.add('translate-y-full');const banner=document.getElementById('toast');banner.textContent=`${r.emoji} Delicious ${r.name}! +${gain.toLocaleString()} strength`;banner.style.opacity=1;setTimeout(()=>{banner.style.opacity=0;document.getElementById('bottom-dock').classList.remove('translate-y-full');},2500);}
    document.getElementById('party-btn').onclick=()=>openModal('party');document.getElementById('cook-btn').onclick=()=>openModal('cook');document.getElementById('close').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal();};document.getElementById('theme').onclick=()=>{state.night=!state.night;scene.background.copy(state.night?night:day);scene.fog.color.set(state.night?0x1e293b:0x9bdcf6);sun.intensity=state.night?.4:2;save();render();};document.getElementById('mute').onclick=()=>{state.muted=!state.muted;save();render();};document.getElementById('reset').onclick=()=>{if(confirm('Reset campsite progress?')){state=defaults();save();syncParty();render();}};
    function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/Math.max(1,innerHeight);camera.fov=camera.aspect<1?48:42;camera.position.set(0,camera.aspect<1?13:11,camera.aspect<1?20:16);camera.lookAt(0,1,0);camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();syncParty();render();
    let last=performance.now();function animate(now){requestAnimationFrame(animate);const t=now*.001,dt=Math.min(.05,(now-last)/1000);last=now;models.forEach((m,i)=>{if(!m.target||m.pos.distanceTo(m.target)<.3)m.target=new THREE.Vector3(Math.random()*9-4.5,0,Math.random()*7-3);const d=m.target.clone().sub(m.pos);d.y=0;if(d.length()>.2){d.normalize();m.pos.addScaledVector(d,dt*1.15);m.g.position.copy(m.pos);m.g.rotation.y=Math.atan2(d.x,d.z);}m.body.position.y=.55+Math.abs(Math.sin(t*3+m.phase))*0.12;});snorlax.position.y=Math.sin(t*1.5)*.035;fire.scale.y=.8+Math.sin(t*12)*.15;renderer.render(scene,camera);}requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
