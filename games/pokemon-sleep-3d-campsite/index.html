<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7dd3fc">
  <title>Pokémon Sleep — Cozy Campsite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#7dd3fc;font-family:Nunito,system-ui,sans-serif;color:#1e293b}.font-display{font-family:Fredoka,system-ui,sans-serif}#game-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none}.glass{background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}.hidden{display:none!important}button{touch-action:manipulation;cursor:pointer}.no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}.pop{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <canvas id="game-canvas" aria-label="Cozy campsite game"></canvas>
  <header class="fixed inset-x-0 top-0 z-10 flex items-start justify-between gap-2 p-3 sm:p-4 pointer-events-none">
    <div class="glass pointer-events-auto flex max-w-[330px] flex-1 items-center gap-3 rounded-2xl border-2 border-amber-200 p-2.5 shadow-lg"><div class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 text-white"><span class="text-[9px] font-black">RANK</span><b id="rank" class="font-display">B-1</b></div><div class="min-w-0 flex-1"><div class="flex justify-between gap-2"><b id="rank-name" class="font-display truncate">Basic 1</b><b>⚡ <span id="strength">0</span></b></div><div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-200"><div id="progress" class="h-full rounded-full bg-gradient-to-r from-amber-400 to-rose-400" style="width:0%"></div></div><div class="mt-0.5 flex justify-between text-[10px] font-bold text-slate-500"><span>Snorlax Strength</span><span id="next-rank">Next: 1,200</span></div></div></div>
    <div class="pointer-events-auto flex gap-1.5"><button id="theme" class="glass rounded-xl border-b-4 border-slate-300 px-3 py-2 font-bold">☀️</button><button id="mute" class="glass rounded-xl border-b-4 border-slate-300 px-3 py-2">🔊</button><button id="reset" class="glass rounded-xl border-b-4 border-slate-300 px-3 py-2 text-rose-600">↻</button></div>
  </header>
  <div id="tip" class="fixed left-1/2 top-[76px] z-10 -translate-x-1/2 rounded-full bg-slate-900/80 px-4 py-1.5 text-center text-xs font-bold text-white shadow">Tap Pokémon to gather • Tap Snorlax or Pot to cook!</div>
  <div id="toast" class="pointer-events-none fixed left-1/2 top-20 z-30 -translate-x-1/2 rounded-full bg-slate-900/90 px-4 py-2 text-sm font-bold text-white opacity-0 transition-opacity"></div>
  <footer id="bottom-dock" class="fixed inset-x-0 bottom-0 z-10 p-2.5 sm:p-4"><div class="glass mx-auto max-w-3xl rounded-3xl border-2 border-amber-200 p-2.5 shadow-2xl"><div class="mb-1 flex justify-between px-1 text-[11px] font-bold text-slate-600"><span>🧺 Ingredient bag</span><span>In Party • Total: <b id="total">0</b></span></div><div id="bag" class="no-scrollbar flex gap-1.5 overflow-x-auto"></div><div class="mt-2 grid grid-cols-2 gap-2"><button id="party-btn" class="rounded-2xl border-b-4 border-indigo-800 bg-indigo-600 py-3 font-display font-bold text-white">👥 Party (<span id="party-count">5</span>/5)</button><button id="cook-btn" class="rounded-2xl border-b-4 border-orange-800 bg-gradient-to-b from-amber-400 to-orange-600 py-3 font-display font-bold text-white">🍲 Cook Meal <span id="ready" class="hidden rounded-full bg-emerald-500 px-2 text-xs">Ready!</span></button></div></div></footer>
  <div id="modal" class="hidden fixed inset-0 z-20 items-end justify-center bg-slate-950/60 p-0 backdrop-blur-sm sm:items-center sm:p-4"><section class="pop glass max-h-[85dvh] w-full max-w-xl overflow-hidden rounded-t-3xl border-4 border-amber-200 sm:rounded-3xl"><div class="flex items-center justify-between bg-gradient-to-r from-amber-500 to-rose-500 p-4 text-white"><div><h2 id="modal-title" class="font-display text-xl font-bold">Cooking Pot</h2><p id="modal-subtitle" class="text-xs">Gather ingredients to cook!</p></div><button id="close" class="rounded-full bg-white/20 px-3 py-1 text-lg">✕</button></div><div id="modal-content" class="max-h-[65dvh] space-y-2 overflow-y-auto p-3"></div></section></div>
  <script>
  (()=>{
    'use strict';
    const canvas=document.getElementById('game-canvas'),ctx=canvas.getContext('2d');
    const ids=['pikachu','eevee','espeon','fuecoco','applin','gengar','blastoise','zapdos','mew'];
    const names=['Pikachu','Eevee','Espeon','Fuecoco','Applin','Gengar','Blastoise','Zapdos','Mew'];
    const emojis=['⚡','🦊','✨','🐊','🍎','👻','🐢','🐤','💗'];
    const colors=['#facc15','#b45309','#d8b4fe','#ef4444','#f87171','#6366f1','#38bdf8','#fbbf24','#f9a8d4'];
    const ingredients=['Spark Cheese','Sunlit Wheat','Mystic Egg','Blaze Tomato','Crisp Apple','Shadow Beef','Hydro Rice','Thunder Chicken','Creamy Milk'];
    const recipes=[{name:'Pizza',emoji:'🍕',power:1200,need:{1:2,0:2,3:1}},{name:'Hamburger',emoji:'🍔',power:1400,need:{1:2,5:2,3:1}},{name:'Teriyaki Chicken & Rice',emoji:'🍛',power:1500,need:{7:2,6:2,4:1}},{name:'Mac and Cheese',emoji:'🧀',power:1350,need:{1:2,0:2,8:1}},{name:'Waffles',emoji:'🧇',power:1450,need:{1:2,2:1,8:1,4:1}}];
    const key='pokemon_sleep_3d_camp_v2';let state;
    function defaults(){return{party:[0,1,2,3,4],bag:Array(9).fill(0),strength:0,night:false,muted:false};}
    try{state={...defaults(),...JSON.parse(localStorage.getItem(key)||'{}')};state.party=Array.isArray(state.party)?state.party.filter(i=>Number.isInteger(i)&&i>=0&&i<9).slice(0,5):defaults().party;state.bag=Array.isArray(state.bag)&&state.bag.length===9?state.bag.map(n=>Math.max(0,Number(n)||0)):defaults().bag;}catch{state=defaults();}
    const save=()=>{try{localStorage.setItem(key,JSON.stringify(state));}catch{}};
    let w=innerWidth,h=innerHeight,dpr=1,spots=[];let toastTimer,audio;
    function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
    addEventListener('resize',resize);resize();
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,2200);}
    function tone(freq=520){if(state.muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.value=.1;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.21);}catch{}}
    function canCook(r){return Object.entries(r.need).every(([i,n])=>state.bag[i]>=n);}
    function render(){let total=0;document.getElementById('bag').innerHTML=ids.map((id,i)=>{total+=state.bag[i];return `<div class="shrink-0 rounded-xl border px-2 py-1 text-center ${state.party.includes(i)?'border-emerald-300 bg-emerald-50':'border-slate-200 bg-slate-50'}"><div>${emojis[i]} <b>${state.bag[i]}</b></div><small>${ingredients[i].split(' ')[0]}</small></div>`;}).join('');document.getElementById('total').textContent=total;document.getElementById('party-count').textContent=state.party.length;const ranks=[[0,'Basic 1','B-1'],[1200,'Basic 2','B-2'],[2500,'Basic 3','B-3'],[4000,'Basic 4','B-4'],[5800,'Basic 5','B-5'],[8000,'Great 1','G-1'],[10500,'Great 2','G-2'],[13500,'Great 3','G-3'],[17000,'Great 4','G-4'],[21000,'Great 5','G-5'],[25500,'Ultra 1','U-1'],[30500,'Ultra 2','U-2'],[36000,'Ultra 3','U-3'],[42000,'Ultra 4','U-4'],[49000,'Ultra 5','U-5'],[57000,'Master 1','M-1']];let r=0;while(r<ranks.length-1&&state.strength>=ranks[r+1][0])r++;document.getElementById('rank').textContent=ranks[r][2];document.getElementById('rank-name').textContent=ranks[r][1];document.getElementById('strength').textContent=state.strength.toLocaleString();const next=ranks[r+1];document.getElementById('next-rank').textContent=next?`Next: ${next[0].toLocaleString()}`:'Camp champion!';document.getElementById('progress').style.width=next?Math.min(100,(state.strength-ranks[r][0])/(next[0]-ranks[r][0])*100)+'%':'100%';document.getElementById('ready').classList.toggle('hidden',!recipes.some(canCook));document.getElementById('theme').textContent=state.night?'🌙':'☀️';document.getElementById('mute').textContent=state.muted?'🔇':'🔊';}
    function drawPup(x,y,i,scale,time){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='rgba(15,23,42,.18)';ctx.beginPath();ctx.ellipse(0,40,35,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=colors[i];ctx.strokeStyle='#49321d';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,12,30,34,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-18,27,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.font='bold 34px system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(emojis[i],0,-18);ctx.fillStyle='#263238';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(names[i],0,58);ctx.restore();}
    function drawSnorlax(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(15,23,42,.2)';ctx.beginPath();ctx.ellipse(0,88,100,24,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#287485';ctx.strokeStyle='#174b59';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,30,100,76,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.ellipse(0,48,70,53,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#287485';ctx.beginPath();ctx.arc(0,-38,55,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.ellipse(0,-28,43,33,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263238';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('😴',0,-29);ctx.font='bold 18px system-ui';ctx.fillText('SNORLAX',0,120);ctx.restore();}
    function drawTree(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#854d0e';ctx.fillRect(-8,0,16,42);ctx.fillStyle='#15803d';for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(0,-55+j*28);ctx.lineTo(-42+j*7,16+j*18);ctx.lineTo(42-j*7,16+j*18);ctx.closePath();ctx.fill();}ctx.restore();}
    function renderScene(time){ctx.clearRect(0,0,w,h);const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,state.night?'#172554':'#38bdf8');sky.addColorStop(.47,state.night?'#334155':'#bae6fd');sky.addColorStop(.48,state.night?'#1e3a2f':'#65bd55');sky.addColorStop(1,state.night?'#14532d':'#3f9a48');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);if(!state.night){ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(w*.83,h*.17,30,0,Math.PI*2);ctx.fill();}else{ctx.fillStyle='#fef3c7';ctx.beginPath();ctx.arc(w*.83,h*.16,24,0,Math.PI*2);ctx.fill();}
      const horizon=h*.43;for(let i=0;i<12;i++){const x=(i/11)*w;drawTree(x,horizon+(i%2)*10,.52+(i%3)*.1);}ctx.fillStyle='rgba(255,255,255,.45)';for(let i=0;i<5;i++){const x=(i*173+time*8)%(w+120)-60;ctx.beginPath();ctx.ellipse(x,h*.2+i%2*22,40,13,0,0,Math.PI*2);ctx.ellipse(x+25,h*.2-8+i%2*22,30,14,0,0,Math.PI*2);ctx.fill();}
      const footerTop=h-Math.min(210,h*.29),playTop=Math.max(210,h*.30),playBottom=footerTop-15,playHeight=Math.max(180,playBottom-playTop);const snX=w*.5,snY=playTop+playHeight*.28,scale=Math.max(.56,Math.min(.9,w/480));drawSnorlax(snX,snY,scale);spots=[];spots.push({x:snX,y:snY,kind:'cook'});
      // Campfire and pot beside Snorlax
      const px=Math.max(45,snX-w*.27),py=snY+35;ctx.fillStyle='#64748b';for(let i=0;i<7;i++){const a=i/7*Math.PI*2;ctx.beginPath();ctx.arc(px+Math.cos(a)*25,py+20+Math.sin(a)*8,7,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#fb923c';ctx.beginPath();ctx.moveTo(px,py+23);ctx.quadraticCurveTo(px-18,py-5,px,py-20);ctx.quadraticCurveTo(px+20,py+2,px,py+23);ctx.fill();ctx.fillStyle='#334155';ctx.beginPath();ctx.ellipse(px,py-10,23,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fde68a';ctx.font='22px system-ui';ctx.textAlign='center';ctx.fillText('🍲',px,py-11);spots.push({x:px,y:py-5,kind:'cook'});
      const cols=w>700?3:2,rows=Math.ceil(state.party.length/cols),cellW=w/cols,cellH=Math.max(72,playHeight*.48/Math.max(1,rows));state.party.forEach((id,j)=>{const c=j%cols,r=Math.floor(j/cols),x=cellW*(c+.5),y=playTop+playHeight*.67+r*cellH+(Math.sin(time*2+j)*4);const s=Math.max(.55,Math.min(.85,cellW/210));drawPup(x,y,id,s,time);spots.push({x,y,kind:'pokemon',id});});
    }
    function gather(i){state.bag[i]++;save();render();document.getElementById('tip').classList.add('hidden');tone(430+i*38);toast(`+1 ${emojis[i]} ${ingredients[i]}`);}
    function canCook(r){return Object.entries(r.need).every(([i,n])=>state.bag[i]>=n);}
    function openModal(mode){const modal=document.getElementById('modal'),content=document.getElementById('modal-content');modal.dataset.mode=mode;modal.classList.remove('hidden');modal.classList.add('flex');if(mode==='party'){document.getElementById('modal-title').textContent='Campsite Party';document.getElementById('modal-subtitle').textContent='Choose up to five Pokémon helpers.';content.innerHTML=ids.map((id,i)=>`<button data-party="${i}" class="flex w-full items-center justify-between rounded-2xl border-2 p-3 text-left ${state.party.includes(i)?'border-indigo-400 bg-indigo-50':'border-slate-200 bg-white'}"><span class="font-bold">${emojis[i]} ${names[i]} <small class="text-slate-500">${ingredients[i]}</small></span><b>${state.party.includes(i)?'Active':'Add'}</b></button>`).join('');content.querySelectorAll('[data-party]').forEach(b=>b.onclick=()=>{const i=+b.dataset.party,at=state.party.indexOf(i);if(at>=0){if(state.party.length>1)state.party.splice(at,1);}else if(state.party.length<5)state.party.push(i);else toast('Party is full. Remove one first.');save();render();openModal('party');});}else{document.getElementById('modal-title').textContent="Snorlax's Cooking Pot";document.getElementById('modal-subtitle').textContent='Gather ingredients to cook a meal!';content.innerHTML=recipes.map((r,i)=>`<article class="rounded-2xl border-2 ${canCook(r)?'border-amber-400':'border-slate-200'} bg-white p-3"><div class="flex items-center justify-between gap-2"><div><b class="font-display text-lg">${r.emoji} ${r.name}</b><div class="text-xs font-bold text-amber-700">+${r.power.toLocaleString()} strength</div></div><button data-recipe="${i}" ${canCook(r)?'':'disabled'} class="rounded-xl px-4 py-2 font-bold ${canCook(r)?'bg-orange-500 text-white':'bg-slate-200 text-slate-400'}">Cook</button></div><div class="mt-2 flex flex-wrap gap-1">${Object.entries(r.need).map(([id,n])=>`<span class="rounded-lg px-2 py-1 text-xs ${state.bag[id]>=n?'bg-emerald-100':'bg-rose-50'}">${emojis[id]} ${state.bag[id]}/${n}</span>`).join('')}</div></article>`).join('');content.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>cook(+b.dataset.recipe));}}
    function closeModal(){const m=document.getElementById('modal');m.classList.add('hidden');m.classList.remove('flex');}
    function cook(i){const r=recipes[i];if(!canCook(r))return;Object.entries(r.need).forEach(([id,n])=>state.bag[id]-=n);const gain=r.power*(Math.random()<.25?2:1);state.strength+=gain;save();render();closeModal();document.getElementById('bottom-dock').classList.add('translate-y-full');toast(`${r.emoji} ${r.name}! +${gain.toLocaleString()} strength`);setTimeout(()=>document.getElementById('bottom-dock').classList.remove('translate-y-full'),2200);}
    canvas.addEventListener('pointerdown',e=>{const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let best=null,dist=Infinity;spots.forEach(s=>{const d=Math.hypot(s.x-x,s.y-y);if(d<dist){dist=d;best=s;}});if(best&&dist<Math.max(65,w*.16)){if(best.kind==='pokemon')gather(best.id);else openModal('cook');}});
    document.getElementById('party-btn').onclick=()=>openModal('party');document.getElementById('cook-btn').onclick=()=>openModal('cook');document.getElementById('close').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};document.getElementById('theme').onclick=()=>{state.night=!state.night;save();render();};document.getElementById('mute').onclick=()=>{state.muted=!state.muted;save();render();};document.getElementById('reset').onclick=()=>{if(confirm('Reset campsite progress?')){state=defaults();save();render();}};
    function frame(now){renderScene(now/1000);requestAnimationFrame(frame);}render();requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
